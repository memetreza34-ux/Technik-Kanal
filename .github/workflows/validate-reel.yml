name: Validate Sicherungs-Reel

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Render control frame - hook
        run: npx remotion still src/index.ts SicherungsReel outputs/control-hook.png --frame=90

      - name: Render control frame - mechanisms
        run: npx remotion still src/index.ts SicherungsReel outputs/control-mechanisms.png --frame=1140

      - name: Render control frame - CTA
        run: npx remotion still src/index.ts SicherungsReel outputs/control-cta.png --frame=1980

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: pip install reportlab

      - name: Generate learning sheet PDF
        run: python scripts/create_lernzettel.py

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sicherungs-reel-validation
          path: |
            outputs/control-hook.png
            outputs/control-mechanisms.png
            outputs/control-cta.png
            outputs/lernzettel-sicherung.pdf
          if-no-files-found: error
          retention-days: 14
