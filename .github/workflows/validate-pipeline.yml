name: Validate Science Channel

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contracts:
    name: Contracts and policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Node script syntax
        run: npm run validate:science-syntax
      - name: Reel folder contract
        run: npm run validate:science-template
      - name: System structure
        run: npm run validate:science-system
      - name: Science configuration consistency
        run: npm run validate:science-consistency
      - name: Science Static visual policy
        run: npm run validate:science-visual-policy

  types-and-unit:
    name: TypeScript and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npx vitest run

  pipeline-contracts:
    name: Science scaffold and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Science scaffold transaction
        run: npm run science:scaffold-test
      - name: Science E2E contracts
        run: npm run science:e2e

  remotion-smoke:
    name: ScienceReel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Static ScienceReel smoke still
        run: npm run smoke
