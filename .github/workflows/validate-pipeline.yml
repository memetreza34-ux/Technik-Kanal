name: Validate Elektrotechnik Pipeline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate pipeline syntax
        run: |
          node --check scripts/lib/electrical-project.mjs
          node --check scripts/setup_local_transcription.mjs
          node --check scripts/transcribe_electrical_voiceover.mjs
          node --check scripts/prepare_electrical_reel.mjs
          node --check scripts/render_electrical_reel.mjs
          node --check scripts/qa_electrical_render.mjs
          node --check scripts/finish_electrical_reel.mjs

      - name: TypeScript check
        run: npm run check

      - name: Validate JSON contracts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('channels/elektrotechnik/src/generated/reel-runtime.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('channels/elektrotechnik/reels/2026-08-03_bis_2026-08-09/02_Warum-fliegt-die-Sicherung-raus/06-projektdateien/scene-plan.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('channels/elektrotechnik/reels/2026-08-03_bis_2026-08-09/02_Warum-fliegt-die-Sicherung-raus/06-projektdateien/sfx-events.json','utf8'))"
