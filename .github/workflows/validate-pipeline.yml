name: Validate Elektrotechnik System

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Full system validation
        run: npm test

      - name: Scaffold transaction
        run: npm run electrical:scaffold-test

      - name: E2E contracts
        run: npm run electrical:e2e

      - name: Remotion smoke still
        run: npm run smoke
